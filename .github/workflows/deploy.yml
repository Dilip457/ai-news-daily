name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and decompress
        run: |
          base64 -d data.gz.b64 | base64 -d | gunzip > index.html
          wc -c index.html
          head -c 100 index.html
      - uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: index.html
      - name: Deploy via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          B64=$(base64 -w 0 index.html)
          # Update index.html
          INDEX_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/index.html" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          echo "index.html SHA: $INDEX_SHA"
          python3 -c "
          import json, os, urllib.request
          content = os.environ['B64']
          sha = os.environ['INDEX_SHA']
          data = json.dumps({'message':'Deploy: briefing HTML','content':content,'sha':sha,'branch':'main'}).encode()
          req = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPO'] + '/contents/index.html', data=data, method='PUT')
          req.add_header('Authorization', 'token ' + os.environ['GH_TOKEN'])
          req.add_header('Accept', 'application/vnd.github+json')
          resp = urllib.request.urlopen(req)
          print(resp.read().decode()[:200])
          " 
          # Create updates/2026-09-05.html
          python3 -c "
          import json, os, urllib.request
          content = os.environ['B64']
          data = json.dumps({'message':'Deploy: archive 2026-09-05','content':content,'branch':'main'}).encode()
          req = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPO'] + '/contents/updates/2026-09-05.html', data=data, method='PUT')
          req.add_header('Authorization', 'token ' + os.environ['GH_TOKEN'])
          req.add_header('Accept', 'application/vnd.github+json')
          try:
              resp = urllib.request.urlopen(req)
              print(resp.read().decode()[:200])
          except Exception as e:
              print(f'Error: {e}')
          "
          # Delete data.gz.b64
          DATA_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/data.gz.b64" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          python3 -c "
          import json, os, urllib.request
          sha = os.environ['DATA_SHA']
          data = json.dumps({'message':'Cleanup','sha':sha,'branch':'main'}).encode()
          req = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPO'] + '/contents/data.gz.b64', data=data, method='DELETE')
          req.add_header('Authorization', 'token ' + os.environ['GH_TOKEN'])
          req.add_header('Accept', 'application/vnd.github+json')
          try:
              resp = urllib.request.urlopen(req)
              print(resp.read().decode()[:200])
          except Exception as e:
              print(f'Error: {e}')
          "