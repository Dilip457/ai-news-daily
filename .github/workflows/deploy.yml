name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c "
          import base64, gzip, json, os, urllib.request

          # Read data.gz.b64
          with open('data.gz.b64', 'r') as f:
              raw = f.read().strip()

          # The file content on GitHub is base64-encoded by the API
          # When we checkout, we get the raw content
          # The raw content IS the base64(gzip(html)) string
          # So we just need to decode it once and gunzip

          try:
              # Try single decode
              decoded = base64.b64decode(raw)
              html = gzip.decompress(decoded).decode('utf-8')
          except Exception as e1:
              print(f'Single decode failed: {e1}')
              try:
                  # Try double decode (in case of auto-encoding)
                  decoded = base64.b64decode(raw)
                  decoded2 = base64.b64decode(decoded)
                  html = gzip.decompress(decoded2).decode('utf-8')
              except Exception as e2:
                  print(f'Double decode failed: {e2}')
                  # Last resort: try treating raw as gzip directly
                  html = gzip.decompress(raw.encode()).decode('utf-8')

          print(f'HTML size: {len(html)}')

          # Save locally
          with open('index.html', 'w') as f:
              f.write(html)
          os.makedirs('updates', exist_ok=True)
          with open('updates/2026-09-05.html', 'w') as f:
              f.write(html)

          # Push via API
          b64 = base64.b64encode(html.encode('utf-8')).decode('ascii')
          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github+json'}

          # Update index.html
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/index.html', headers=headers)
          resp = urllib.request.urlopen(req)
          sha = json.loads(resp.read())['sha']
          print(f'index.html SHA: {sha}')

          data = json.dumps({'message': 'Deploy: briefing HTML', 'content': b64, 'sha': sha, 'branch': 'main'}).encode()
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/index.html', data=data, method='PUT', headers=headers)
          resp = urllib.request.urlopen(req)
          print(f'index.html updated: {resp.status}')

          # Create updates/2026-09-05.html
          data = json.dumps({'message': 'Deploy: archive', 'content': b64, 'branch': 'main'}).encode()
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/updates/2026-09-05.html', data=data, method='PUT', headers=headers)
          try:
              resp = urllib.request.urlopen(req)
              print(f'archive created: {resp.status}')
          except Exception as e:
              print(f'archive error: {e}')

          # Delete data.gz.b64
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/data.gz.b64', headers=headers)
          resp = urllib.request.urlopen(req)
          data_sha = json.loads(resp.read())['sha']
          data = json.dumps({'message': 'Cleanup', 'sha': data_sha, 'branch': 'main'}).encode()
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/data.gz.b64', data=data, method='DELETE', headers=headers)
          try:
              resp = urllib.request.urlopen(req)
              print(f'data.gz.b64 deleted: {resp.status}')
          except Exception as e:
              print(f'cleanup error: {e}')
          "