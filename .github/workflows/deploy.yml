name: Deploy Briefing

on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64.part*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble, decompress and deploy
        run: |
          cat data.gz.b64.part1 data.gz.b64.part2 data.gz.b64.part3 data.gz.b64.part4 > /tmp/data.gz.b64
          base64 -d /tmp/data.gz.b64 > index.html.gz
          gunzip -f index.html.gz
          DATE=$(grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' index.html | head -1)
          if [ -z "$DATE" ]; then DATE=$(date -u +%Y-%m-%d); fi
          echo "Deploying briefing for $DATE"
          mkdir -p updates
          cp index.html "updates/${DATE}.html"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html "updates/${DATE}.html"
          git rm -f data.gz.b64.part1 data.gz.b64.part2 data.gz.b64.part3 data.gz.b64.part4
          git commit -m "Deploy: full briefing HTML (${DATE})" || echo "No changes"
          git push
