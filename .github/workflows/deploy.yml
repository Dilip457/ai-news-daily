name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import base64, gzip, json, os, urllib.request

          # Read the file
          with open('data.gz.b64', 'r') as f:
              content = f.read().strip()

          # First decode: base64 -> base64(gzip(html))
          # Second decode: base64 -> gzip(html)
          # Third step: gunzip -> html
          try:
              decoded_once = base64.b64decode(content)
              # Check if it's still base64
              try:
                  decoded_twice = base64.b64decode(decoded_once)
                  html = gzip.decompress(decoded_twice).decode('utf-8')
              except:
                  # Maybe it's gzip directly
                  html = gzip.decompress(decoded_once).decode('utf-8')
          except Exception as e:
              print(f"Decode error: {e}")
              raise

          print(f"HTML size: {len(html)}")
          with open('index.html', 'w') as f:
              f.write(html)
          with open('updates/2026-09-05.html', 'w') as f:
              os.makedirs('updates', exist_ok=True)
              f.write(html)

          # Push via API
          b64 = base64.b64encode(html.encode('utf-8')).decode('ascii')

          # Get SHA of index.html
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/contents/index.html',
              headers={'Authorization': f'token {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'}
          )
          resp = urllib.request.urlopen(req)
          sha = json.loads(resp.read())['sha']
          print(f"index.html SHA: {sha}")

          # Update index.html
          data = json.dumps({'message': 'Deploy: briefing HTML', 'content': b64, 'sha': sha, 'branch': 'main'}).encode()
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/contents/index.html',
              data=data, method='PUT',
              headers={'Authorization': f'token {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'}
          )
          resp = urllib.request.urlopen(req)
          print(f"index.html updated: {resp.status}")

          # Create updates/2026-09-05.html
          data = json.dumps({'message': 'Deploy: archive', 'content': b64, 'branch': 'main'}).encode()
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/contents/updates/2026-09-05.html',
              data=data, method='PUT',
              headers={'Authorization': f'token {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'}
          )
          try:
              resp = urllib.request.urlopen(req)
              print(f"updates/2026-09-05.html created: {resp.status}")
          except Exception as e:
              print(f"Archive error: {e}")

          # Delete data.gz.b64
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/contents/data.gz.b64',
              headers={'Authorization': f'token {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'}
          )
          resp = urllib.request.urlopen(req)
          data_sha = json.loads(resp.read())['sha']
          data = json.dumps({'message': 'Cleanup', 'sha': data_sha, 'branch': 'main'}).encode()
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/contents/data.gz.b64',
              data=data, method='DELETE',
              headers={'Authorization': f'token {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'}
          )
          try:
              resp = urllib.request.urlopen(req)
              print(f"data.gz.b64 deleted: {resp.status}")
          except Exception as e:
              print(f"Cleanup error: {e}")
          PYEOF