name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
      - 'data.gz'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decompress and deploy
        run: |
          if [ -f data.gz.b64 ]; then
            base64 -d data.gz.b64 > data.gz
          fi
          gunzip -c data.gz > index.html
          wc -c index.html
          mkdir -p updates
          DATE=$(date -u +%Y-%m-%d)
          cp index.html updates/${DATE}.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          DATE=$(date -u +%Y-%m-%d)
          git add updates/${DATE}.html
          git rm -f data.gz.b64 || true
          git rm -f data.gz || true
          git commit -m "Deploy: briefing ${DATE}" || echo "No changes"
          git push
