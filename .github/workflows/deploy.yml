name: Deploy Full Briefing

on:
  push:
    branches: [main]
    paths:
      - 'data.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decompress briefing
        run: |
          gunzip -c data.gz.b64 > index_full.html
          echo "Decompressed file size: $(wc -c < index_full.html) bytes"

      - name: Replace index.html
        run: |
          cp index_full.html index.html
          rm index_full.html data.gz.b64
          rm -f .github/workflows/deploy.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix: push full briefing with all content" || echo "Nothing to commit"
          git push