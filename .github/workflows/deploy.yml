name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decompress and deploy
        run: |
          base64 -d data.gz.b64 > index.html.gz
          gunzip index.html.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f data.gz.b64 .github/workflows/deploy.yml 2>/dev/null || true
          git commit -m "Deploy: full briefing HTML" || echo "No changes"
          git push
