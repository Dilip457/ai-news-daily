name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decompress
        id: decompress
        run: |
          base64 -d data.gz.b64 > index.html.gz
          gunzip -f index.html.gz
          echo "size=$(wc -c < index.html)" >> $GITHUB_OUTPUT
      - name: Push index.html via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(base64 -w 0 index.html)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/contents/index.html?ref=main \
            | jq -r '.sha')
          echo "Current SHA: $SHA"
          PAYLOAD=$(jq -n --arg c "$CONTENT" --arg s "$SHA" \
            '{message:"Deploy: full briefing HTML",content:$c,sha:$s,branch:"main"}')
          curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/contents/index.html \
            -d "$PAYLOAD"
      - name: Push updates/2026-09-05.html via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(base64 -w 0 index.html)
          PAYLOAD=$(jq -n --arg c "$CONTENT" \
            '{message:"Deploy: archive 2026-09-05",content:$c,branch:"main"}')
          curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/contents/updates/2026-09-05.html \
            -d "$PAYLOAD"
      - name: Remove data.gz.b64 via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/contents/data.gz.b64?ref=main \
            | jq -r '.sha')
          PAYLOAD=$(jq -n --arg s "$SHA" \
            '{message:"Cleanup: remove data.gz.b64",sha:$s,branch:"main"}')
          curl -s -X DELETE \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/contents/data.gz.b64 \
            -d "$PAYLOAD"