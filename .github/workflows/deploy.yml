name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decompress and deploy
        run: |
          set +e
          echo "=== file info ==="
          ls -la data.gz.b64
          file data.gz.b64
          echo "=== first bytes ==="
          od -A x -t x1z data.gz.b64 | head -3
          echo "=== base64 decode ==="
          base64 -d data.gz.b64 > index.html.gz
          DECODE_RC=$?
          echo "base64 decode exit: $DECODE_RC"
          if [ $DECODE_RC -ne 0 ]; then echo "base64 decode failed"; exit 1; fi
          echo "=== gunzip ==="
          gunzip -f index.html.gz
          GUNZIP_RC=$?
          echo "gunzip exit: $GUNZIP_RC"
          if [ $GUNZIP_RC -ne 0 ]; then echo "gunzip failed"; exit 1; fi
          echo "=== result ==="
          ls -la index.html
          wc -c index.html
          grep -c "toggleTheme" index.html || true
          grep -c "modal-overlay" index.html || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f data.gz.b64 2>/dev/null || true
          git commit -m "Deploy: full briefing HTML" || echo "No changes"
          git push
