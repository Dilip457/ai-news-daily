name: Deploy Briefing

on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
      - 'data.gz.b64.part*'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble briefing
        run: |
          if [ -f data.gz.b64 ]; then
            cat data.gz.b64 > assembled.b64
          elif ls data.gz.b64.part* >/dev/null 2>&1; then
            cat $(ls data.gz.b64.part* | sort -V) > assembled.b64
          else
            echo "No briefing data found - nothing to deploy"
            exit 0
          fi
          base64 -d assembled.b64 > index.html.gz
          gunzip -f index.html.gz

      - name: Commit and clean up
        run: |
          DATE=$(grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' index.html | head -1)
          [ -z "$DATE" ] && DATE=$(date +%F)
          mkdir -p updates
          cp index.html "updates/${DATE}.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "updates/${DATE}.html"
          git rm -f --ignore-unmatch data.gz.b64 data.gz.b64.part1 data.gz.b64.part2 data.gz.b64.part3 data.gz.b64.part4 assembled.b64 index.html.gz
          git commit -m "Deploy: briefing ${DATE}" || echo "No changes to commit"
          git push
