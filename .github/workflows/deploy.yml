name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decompress and deploy
        run: |
          base64 -d data.gz.b64 | base64 -d > index.html.gz
          gunzip -f index.html.gz
          mkdir -p updates
          cp index.html updates/2026-09-05.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html updates/2026-09-05.html
          git rm -f data.gz.b64 2>/dev/null || true
          git commit -m "Deploy: full briefing HTML" || echo "No changes"
          git push