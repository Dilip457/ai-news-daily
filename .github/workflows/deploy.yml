name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz.b64'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode and deploy
        run: |
          python3 << 'EOF'
          import base64, gzip, os
          with open('data.gz.b64', 'rb') as f:
              raw = f.read().strip()
          padding = 4 - (len(raw) % 4)
          if padding != 4:
              raw += b'=' * padding
          decoded = base64.b64decode(raw)
          html = gzip.decompress(decoded).decode('utf-8')
          with open('index.html', 'w') as f:
              f.write(html)
          os.makedirs('updates', exist_ok=True)
          with open('updates/2026-09-05.html', 'w') as f:
              f.write(html)
          print(f'HTML size: {len(html)}')
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html updates/2026-09-05.html
          git rm -f data.gz.b64 || true
          git commit -m "Deploy: full briefing HTML" || echo "No changes"
          git push