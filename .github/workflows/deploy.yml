name: Deploy Briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data.gz'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decompress and deploy
        run: |
          gunzip -c data.gz > index.html
          wc -c index.html
          mkdir -p updates
          cp index.html updates/2026-09-05.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html updates/2026-09-05.html
          git rm -f data.gz || true
          git commit -m "Deploy: full briefing HTML" || echo "No changes"
          git push