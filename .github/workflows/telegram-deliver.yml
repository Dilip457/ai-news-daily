name: Telegram Delivery

# The agent writes telegram/outbox.json when it has a briefing to send. This
# workflow is the only thing that talks to api.telegram.org, so the bot token
# lives as a repository secret on the runner and never appears in a URL built
# inside the agent sandbox.
#
# Idempotent: scripts/telegram_send.py refuses to send a second message for a
# date already recorded as delivered in telegram_delivery_log.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'telegram/outbox.json'

permissions: {}

concurrency:
  group: telegram-delivery
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history so the push retry can rebase

      - name: Send the message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_send.py

      # The log is written by the runner, so the agent never has to commit it.
      # Runs on failure too, to record last_error. If main moved meanwhile (e.g. a
      # deploy commit), rebase and retry: a lost log commit would leave the outbox
      # behind and let a later run send the same message twice.
      - name: Record the result
        if: always()
        run: |
          set -euo pipefail
          if ! git status --porcelain -- telegram_delivery_log.json telegram/outbox.json | grep -q .; then
            echo "Nothing to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_delivery_log.json
          git rm -q --ignore-unmatch telegram/outbox.json
          git commit -m "Telegram delivery result [skip ci]" || echo "No changes"
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi
            echo "push rejected (main moved); rebasing and retrying ($attempt/3)"
            git pull --rebase -q origin main
          done
          $pushed || { echo "could not push after 3 attempts"; exit 1; }
